# Prometheus alerting rules — SLO-based, alert on symptoms not causes
groups:
- name: slo_alerts
  rules:
  # Alert on high error rate (symptom = users affected)
  - alert: HighErrorRate
    expr: |
      sum(rate(http_requests_total{status="error"}[5m]))
      / sum(rate(http_requests_total[5m])) > 0.01
    for: 5m
    labels:
      severity: page
    annotations:
      summary: "Error rate above 1% (SLO at risk)"

  # Fast burn: consuming error budget 14x too fast → page
  - alert: ErrorBudgetFastBurn
    expr: |
      sum(rate(http_requests_total{status="error"}[1h]))
      / sum(rate(http_requests_total[1h])) > 0.014
    for: 2m
    labels:
      severity: page
    annotations:
      summary: "Fast error-budget burn — major incident likely"

  # High latency (p99 > 500ms)
  - alert: HighLatency
    expr: |
      histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 0.5
    for: 10m
    labels:
      severity: ticket
    annotations:
      summary: "p99 latency above 500ms"
